<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>O Último Bentô</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #172e35;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        width: min(100vw, 156vh);
        height: auto;
        max-height: 100vh;
        aspect-ratio: 1560/1000;
        touch-action: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas
      id="game"
      width="1560"
      height="1000"
      tabindex="0"
      aria-label="O Último Bentô. Arraste ingredientes para a marmita. R gira, Z desfaz e Escape pausa."
    ></canvas>
    <script src="game.js"></script>
  </body>
</html>
